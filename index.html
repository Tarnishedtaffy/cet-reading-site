body{

}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ========== 顶栏 ========== */
#top{height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;gap:14px;padding:0 16px;

.brand{font-weight:650;white-space:nowrap}
.brand span{color:var(--dim);font-weight:400;margin-left:6px}
.search-group{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:3px 8px 3px 12px;gap:8px;max-width:340px;flex:1;transition:border-color .2s}
.search-group:focus-within{border-color:var(--accent)}
#q{background:transparent;border:none;color:var(--text);outline:none;flex:1;font-size:13px;height:26px}
#q::placeholder{color:var(--dim)}
#hits{background:var(--sel);color:var(--accent);padding:1px 6px;border-radius:4px;font-size:11.5px;white-space:nowrap}
#theme{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);color:var(--mut);flex:0 0 auto}

/* ========== 主体 ========== */

#side{width:var(--side);flex:0 0 var(--side);background:var(--panel);border-right:1px solid var(--line);

  transition:width .2s cubic-bezier(.4,0,.2,1),flex-basis .2s cubic-bezier(.4,0,.2,1)}
#content{flex:1;overflow:auto;min-width:0;background:var(--bg)}
body.collapsed #side{width:48px;flex-basis:48px}
body.collapsed #side:hover{width:var(--side);flex-basis:var(--side);box-shadow:8px 0 24px rgba(0,0,0,.28);z-index:30}
body.collapsed #side:not(:hover) #filters{display:none}
body.collapsed #side:not(:hover) .row{padding:12px 6px}
body.collapsed #side:not(:hover) .row-meta{justify-content:center}
body.collapsed #side:not(:hover) .st,body.collapsed #side:not(:hover) .tag,body.collapsed #side:not(:hover) .row-text{display:none}

/* ========== 筛选 ========== */
#filters{padding:6px 14px 8px;border-bottom:1px solid var(--line);flex:0 1 auto;overflow-y:auto;max-height:46%}
#filters details summary{font-size:11.5px;color:var(--mut);padding:7px 0 5px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;user-select:none;letter-spacing:.03em}
#filters details summary::-webkit-details-marker{display:none}

#filters details:not([open]) summary::after{content:'▸'}
.chip-group{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 6px}
.chip{font-size:11px;padding:2px 8px;border-radius:11px;background:var(--bg);border:1px solid var(--line);
  color:var(--mut);cursor:pointer;line-height:1.5}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.on{background:var(--sel);color:var(--accent);border-color:transparent;font-weight:500}

/* ========== 列表 ========== */
#list{flex:1;overflow-y:auto}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:5px}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel)}
.row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}

.no{color:var(--accent);font-weight:600;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.st{color:var(--dim)}
.tag{color:var(--dim);background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-size:10.5px}
.row-text{color:var(--text);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.empty-state{padding:46px 20px;text-align:center;color:var(--dim);font-size:12.5px}

/* ========== 详情通用 ========== */
.wrap{max-width:880px;margin:0 auto;padding:22px 30px 90px}
.wrap.wide{max-width:1500px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.tab{color:var(--mut);font-size:13px;padding-bottom:0;position:relative}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-9px;height:2px;background:var(--accent)}
.tag-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}

/* ========== 题目卡 ========== */
.stem{font-size:16px;font-weight:600;margin-bottom:22px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 15px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:14px;
  transition:background .15s,border-color .15s,box-shadow .15s}
.opt:hover{background:var(--hover)}
.opt .k{flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;background:var(--panel2);color:var(--mut);font-weight:600;font-size:13px}
.opt .text{margin-top:2px;line-height:1.55;color:var(--text)}
.opt.right{border-color:var(--ok);background:var(--panel);box-shadow:0 0 0 1px var(--ok)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.right .text{font-weight:500}
.opt.wrong{border-color:var(--bad);background:var(--panel)}
.opt.wrong .k{background:var(--bad);color:#fff}

/* ========== 拆解区 ========== */
.explain{border-top:1px dashed var(--line);padding-top:24px;display:flex;flex-direction:column;gap:26px}
.explain-block{min-width:0}
.explain-title{font-size:12px;color:var(--dim);margin-bottom:10px;font-weight:600;letter-spacing:.04em}
.explain-title.green{color:var(--ok)}
.explain-title.red{color:var(--bad)}
.ev{padding:14px 18px;border-left:3px solid var(--accent);background:var(--bg);color:var(--text);
  font-size:14.5px;font-family:Georgia,"Times New Roman",serif;font-style:italic;line-height:1.7;
  border-radius:0 6px 6px 0}
.ev.bad{border-left-color:var(--bad)}

/* 伪表格（原 01 的 .pt） */
.ptab{display:flex;flex-direction:column;font-size:13px}
.ptab-row{display:flex;padding:11px 0;border-bottom:1px solid var(--line);gap:16px;align-items:baseline}
.ptab-row.header{color:var(--dim);font-size:11.5px;border-bottom:2px solid var(--line);padding-bottom:7px;align-items:center}
.ptab-row:last-child{border-bottom:none}

.src{color:var(--dim);font-size:11.5px}
.ptag{display:inline-block;padding:1px 6px;background:var(--bg);border:1px solid var(--line);

/* ========== 原文 ========== */
.ptitle{font-size:11.5px;color:var(--dim);margin:18px 0 8px;letter-spacing:.05em}
.para{margin-bottom:13px;font-size:14px;line-height:1.85;color:var(--text)}

.archive-container{column-count:2;column-gap:20px}

.trap-head{padding:14px 18px;background:linear-gradient(90deg,var(--c-bg) 0%,transparent 100%);

.trap-title-row h3{font-size:15px;color:var(--c-tx);font-weight:600}
.trap-count{font-size:11px;padding:1px 8px;border-radius:11px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.trap-def{font-size:12px;color:var(--mut);line-height:1.5}
.trap-list{padding:0 18px}
.trap-rec{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.trap-rec:last-child{border-bottom:none}
.trap-meta{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;flex:0 0 74px}
.trap-meta .no{font-size:11px;color:var(--dim);background:var(--panel2);padding:2px 5px;border-radius:4px;
  border:1px solid var(--line);text-align:center;width:100%;font-weight:500}
.trap-meta .tag{font-size:13px;font-weight:600;color:var(--text);background:var(--line);width:26px;height:26px;

.trap-content{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.reason{font-size:13px;line-height:1.65}
.trap-content .src{align-self:flex-start;font-size:11.5px;color:var(--accent);background:rgba(76,154,255,.1);

@media (max-width:900px){
  #side{position:absolute;top:0;left:0;bottom:0;box-shadow:4px 0 24px rgba(0,0,0,.3);

education were in the middle at around 15%.", "Martin Neil Baily, an economist who is leading a research project on retirement security, notes that quitting a career can lead to feelings of isolation and loneliness, particularly for men. He suggests that many college-educated workers are choosing to stay in the labor force more for social benefits than for financial reasons. They're also more likely to be in professional occupations where they tend to enjoy their work more.", "Workers in more physical jobs, meanwhile, may be more likely to look forward to retiring, Baily says, suggesting those who stay on are more likely doing so for financial reasons"], "word_count": 346, "questions": [51, 52, 53, 54, 55]}, "2026-06-S1-P1": {"key": "2026-06-S1-P1", "exam": "2026-06", "set": 1, "passage_id": "P1", "paragraphs": ["Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.", "Whether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.", "Science won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.", "One thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.", "Organic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.", "In fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.", "The use of animal waste in organic agriculture can also be a factor in the spread of bacteria like E. coli and salmonella. Over the past 10 years, Canada has seen more food-safety recalls for organic products, proportionally, than for conventional products.", "On the whole, organic agriculture may have a smaller environmental footprint. That's mostly because the risk of groundwater contamination from organic farming is lower. Organic farmers never used neonics, the controversial pesticides that have been linked to shrinking bee populations worldwide.", "Traditional agriculture has been making \"dramatic improvements\" to reduce its impact on the environment.", "It isn't a black-and-white picture, though.", "Organic farming is much less efficient when it comes to land use, although yields vary considerably depending on the crop.", "On the other hand, advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture"], "word_count": 347, "questions": [46, 47, 48, 49, 50]}, "2026-06-S1-P2": {"key": "2026-06-S1-P2", "exam": "2026-06", "set": 1, "passage_id": "P2", "paragraphs": ["It is still controversial whether we are fundamentally generous or selfish and whether these tendencies are shaped by our genes or environment.", "Some evidence points to humans being born cooperative. At later stages in life we routinely work together to reach goals and help out in times of need.", "Yet instances of selfish behavior are also plenty. One recent study tested people's willingness to set aside selfish interests to reach a greater good. It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however. Another study showed that players who cooperated did better in the long run.", "It seems that human nature supports both pro-social and selfish traits. Genetic studies have made some progress toward identifying their biological roots. By comparing identical twins, who share nearly 100 percent of their genes, and non-identical twins, who share about half, researchers have found overwhelming evidence for genetic effects on behaviors. In these twin studies, identical and non-identical twins are asked, for example, to split a sum of money with a peer. Such studies often also rely on careful psychological assessments and DNA analysis.", "Other work highlights specific genes as key players. My colleagues and I recently identified a gene linked to altruistic behavior and found that a particular variant of it was associated with more selfish behavior in preschoolers.", "According to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line. As communities diversified, mutual support could have broadened to include individuals not linked by blood. Another possibility is that humans cooperate to gain some advantage, such as boosting reputation. Finally, evolutionary processes take place at the group level. Groups of highly cooperative individuals have higher chances of survival because they can work together to reach goals that are unattainable to less cooperative groups.", "Yet almost no behavior is entirely genetic, even among identical twins. Culture, schooling and parenting are important determinants of cooperation. Thus, the degree to which we act cooperatively or selfishly is unique to each individual and depends on a variety of genetic and environmental influences"], "word_count": 349, "questions": [51, 52, 53, 54, 55]}, "2026-06-S3-P1": {"key": "2026-06-S3-P1", "exam": "2026-06", "set": 3, "passage_id": "P1", "paragraphs": ["Disgust is a universal human emotion. One type of disgust is called physical disgust, which protects us from eating or touching things that could be dangerous for us, such as raw meat or insects. Children experience physical disgust from a very early age, but do not achieve an understanding of the concept until they are around four years old.", "Some researchers maintain that there is another type of disgust, called moral disgust, that protects us from engaging in activities that can be perceived as morally wrong. Examples of moral disgust are stealing, lying or cheating.", "However, not all academics think that moral disgust really exists. Some say that when we refer to disgust in relation to moral issues, we are using disgust as a metaphor, and what we are feeling is in reality anger.", "If moral disgust appears quite late in development, it makes sense to think that there is actually a social component to it. Children learn about emotions in many different ways. Of special relevance are parents-children conversations about emotions. Indeed, children whose parents talk about emotions often have a better emotional understanding than children whose parents do not discuss emotions often.", "However, there are no studies that have examined how parents and children talk about disgust. This is what we set up to examine in our study.", "We asked 68 English-speaking mothers and their four-, six- or eight-year-old children to discuss some stories about moral and physical disgust. Our preliminary findings show mothers and children do talk about disgust, but mainly about physical disgust and not so much about moral disgust.", "When we asked mothers and children to discuss moral issues, such as whether it is OK to play with a child who has stolen someone else's snack, they linked this type of moral wrongdoing with the emotion of anger and not disgust.", "Does this mean that moral disgust does not exist? Some researchers suggest moral disgust exists in adults. Our findings suggest that moral disgust is either understood at a later age or is only used metaphorically, if at all, in children as old as eight years."], "word_count": 350, "questions": [46, 47, 48, 49, 50]}, "2026-06-S3-P2": {"key": "2026-06-S3-P2", "exam": "2026-06", "set": 3, "passage_id": "P2", "paragraphs": ["After finding out details about a stranger, we mistakenly think that they also know about us. As a result, we act more honestly around them, according to a recent study in Nature.", "Past research has found that we tend to assume social relationships are reciprocal. Most of the time, this assumption is accurate: someone you think of as a friend will usually consider you a friend too. But sometimes our social ties are more one-sided: for example, you might learn something about a stranger who doesn't know you at all. Researchers Anuj Shah and Michael LaForest wondered whether our tendency to believe that social ties are reciprocal could lead us to mistakenly feel that a stranger does actually know us.", "In a series of lab-based studies, this is exactly what the researchers found. When we know about strangers, we erroneously think they also know about us. But the really interesting finding came when the researchers stepped out of the lab, to conduct a field experiment. The team developed leaflets containing fairly ordinary information about local community police officers, such as their favourite food, hobbies, or reasons for joining the police force. They then sent out these leaflets to every apartment in a number of housing developments in disadvantaged areas. The officers themselves also dropped off cards to local residents containing similar information.", "Two months later, the researchers surveyed residents at these housing developments as well as control areas that did not receive leaflets or outreach cards. Residents were asked to imagine that they had committed a crime and how likely it would be that local officers would find out about it. They also rated how well the officers in the area knew them.", "The team found that residents of the developments that had received the leaflets believed it more likely that local officers would find out about illegal activity than residents of the control areas. Even more strikingly, the team found that immediately after the leaflet distribution, there were fewer criminal complaints and arrests in the areas around the developments that had received the leaflets than around the control developments."], "word_count": 350, "questions": [51, 52, 53, 54, 55]}}, "items": [{"schema_version": "1.0", "item_id": "2025-12-C-1-46", "source": {"exam": "2025-12", "set": 1, "section": "C", "passage_id": "P1", "question_no": 46}, "passage": {"text": "All living organisms on Earth are exposed to a 24-hour day-night cycle. This cycle is the reason why people rest at night and are active during the day. Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health. For example, eating at night can lead to weight gain over time because food intake at night leads to increased fat storage.\n\nMany drug targets in the body follow a 24-hour cycle, too. This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period. Because how the body responds to a drug can differ depending on the time it is taken, it logically follows that taking medicines at specific times could help increase their effectiveness and reduce unwanted side effects.\n\nWhen doctors prescribe medicine for people, they rarely consider the best time to take it. There are two main reasons for that oversight. First, many physicians are not aware that some drugs work better during a specific time of the day. And second, most drugs have not been studied for possible different effects during a 24- hour cycle. Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.\n\nOver 50 years ago, researchers found that the cholesterol drug simvastatin is more effective at lowering cholesterol levels when taken at night rather than during the day. This is because the liver enzyme these drugs target is more active at night.\n\nTaking medicine at the wrong time can even cause harm. My colleagues and I wondered whether midazolam, the most common sedative used in surgical procedures worldwide, might interfere with the internal clock that protects the heart at night. Currently, there are no guidelines regarding when midazolam should be administered.\n\nMore research is needed to determine the best times to administer treatments for different diseases. I believe taking drug timing into account could help make treatments more effective and help more people worldwide", "word_count": 344}, "stem": "What do we learn from the passage about the timing of our behaviors?", "options": [{"key": "A", "text": "It has a considerable impact on our health."}, {"key": "B", "text": "It confines us to a 24-hour day-night cycle."}, {"key": "C", "text": "It requires us to follow a particular rhythm."}, {"key": "D", "text": "It holds the key to all human body functions."}], "answer": "A", "explain": {"answer_evidence": "Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health.", "wrong_options": [{"key": "B", "type": "polarity_flip", "why": "原文说生物暴露在昼夜节律中、所以夜里休息——节律是外部条件；B 说行为时机把我们「限制」在 24 小时周期里，主客颠倒。", "source": "P1 第1–2句"}, {"key": "C", "type": "concept_swap", "why": "原文说人体功能遵循节律；C 把「遵循节律」挪到「行为时机」上，还加了 requires（强制）。", "source": "P1 第2句"}, {"key": "D", "type": "absolute", "why": "原文只说人体功能也都遵循节律，D 夸成「时机是一切人体功能的关键」，绝对化。", "source": "P1 第2句"}], "answer_evidence_para": 1, "paraphrase": [{"from": "can significantly influence your health", "to": "has a considerable impact on our health"}, {"from": "the timing of behaviors like exercise or food intake", "to": "the timing of our behaviors"}, {"from": "eating at night can lead to weight gain", "to": "considerable impact"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["polarity_flip", "concept_swap", "absolute"], "difficulty": 2, "topic_zh": "行为时机（运动/进食）显著影响健康，夜里吃东西易增重"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2025-12-S1-P1"}, {"schema_version": "1.0", "item_id": "2025-12-C-1-47", "source": {"exam": "2025-12", "set": 1, "section": "C", "passage_id": "P1", "question_no": 47}, "passage": {"text": "All living organisms on Earth are exposed to a 24-hour day-night cycle. This cycle is the reason why people rest at night and are active during the day. Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health. For example, eating at night can lead to weight gain over time because food intake at night leads to increased fat storage.\n\nMany drug targets in the body follow a 24-hour cycle, too. This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period. Because how the body responds to a drug can differ depending on the time it is taken, it logically follows that taking medicines at specific times could help increase their effectiveness and reduce unwanted side effects.\n\nWhen doctors prescribe medicine for people, they rarely consider the best time to take it. There are two main reasons for that oversight. First, many physicians are not aware that some drugs work better during a specific time of the day. And second, most drugs have not been studied for possible different effects during a 24- hour cycle. Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.\n\nOver 50 years ago, researchers found that the cholesterol drug simvastatin is more effective at lowering cholesterol levels when taken at night rather than during the day. This is because the liver enzyme these drugs target is more active at night.\n\nTaking medicine at the wrong time can even cause harm. My colleagues and I wondered whether midazolam, the most common sedative used in surgical procedures worldwide, might interfere with the internal clock that protects the heart at night. Currently, there are no guidelines regarding when midazolam should be administered.\n\nMore research is needed to determine the best times to administer treatments for different diseases. I believe taking drug timing into account could help make treatments more effective and help more people worldwide", "word_count": 344}, "stem": "What does the author say about the proteins in our body?", "options": [{"key": "A", "text": "They can modify the effects of medicines in different ways."}, {"key": "B", "text": "They can reduce unwanted side effects of certain medicines."}, {"key": "C", "text": "Their reaction to medicines changes during the day-night cycle."}, {"key": "D", "text": "Their design determines how differently they react to medicines."}], "answer": "C", "explain": {"answer_evidence": "This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period.", "wrong_options": [{"key": "A", "type": "concept_swap", "why": "原文是蛋白质对药物「反应不同」，A 说蛋白质「以不同方式改变药效」，主客颠倒。", "source": "P2 第2句"}, {"key": "B", "type": "no_mention", "why": "减少副作用是「在特定时间服药」可能带来的结果，不是蛋白质本身的功能。", "source": "P2 第3句"}, {"key": "D", "type": "concept_swap", "why": "原文说的是「药物被设计去作用于蛋白质」，D 说成「蛋白质的设计决定反应」，张冠李戴。", "source": "P2 第2句"}], "answer_evidence_para": 2, "paraphrase": [{"from": "the specific proteins a drug is designed to modify", "to": "the proteins in our body"}, {"from": "can react differently ... over the course of a 24-hour time period", "to": "changes during the day-night cycle"}, {"from": "Many drug targets in the body follow a 24-hour cycle", "to": "day-night cycle"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["concept_swap", "no_mention"], "difficulty": 3, "topic_zh": "蛋白质对药物的反应随 24 小时周期变化"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2025-12-S1-P1"}, {"schema_version": "1.0", "item_id": "2025-12-C-1-48", "source": {"exam": "2025-12", "set": 1, "section": "C", "passage_id": "P1", "question_no": 48}, "passage": {"text": "All living organisms on Earth are exposed to a 24-hour day-night cycle. This cycle is the reason why people rest at night and are active during the day. Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health. For example, eating at night can lead to weight gain over time because food intake at night leads to increased fat storage.\n\nMany drug targets in the body follow a 24-hour cycle, too. This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period. Because how the body responds to a drug can differ depending on the time it is taken, it logically follows that taking medicines at specific times could help increase their effectiveness and reduce unwanted side effects.\n\nWhen doctors prescribe medicine for people, they rarely consider the best time to take it. There are two main reasons for that oversight. First, many physicians are not aware that some drugs work better during a specific time of the day. And second, most drugs have not been studied for possible different effects during a 24- hour cycle. Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.\n\nOver 50 years ago, researchers found that the cholesterol drug simvastatin is more effective at lowering cholesterol levels when taken at night rather than during the day. This is because the liver enzyme these drugs target is more active at night.\n\nTaking medicine at the wrong time can even cause harm. My colleagues and I wondered whether midazolam, the most common sedative used in surgical procedures worldwide, might interfere with the internal clock that protects the heart at night. Currently, there are no guidelines regarding when midazolam should be administered.\n\nMore research is needed to determine the best times to administer treatments for different diseases. I believe taking drug timing into account could help make treatments more effective and help more people worldwide", "word_count": 344}, "stem": "What do doctors do when prescribing medicine for people?", "options": [{"key": "A", "text": "They give little thought to the time of taking it for maximum effect."}, {"key": "B", "text": "They rarely consider which medicine works better for which patient."}, {"key": "C", "text": "They tell patients its possible side effects during a period of 24 hours."}, {"key": "D", "text": "They tell patients to comply with the directions of drug manufacturers."}], "answer": "A", "explain": {"answer_evidence": "When doctors prescribe medicine for people, they rarely consider the best time to take it.", "wrong_options": [{"key": "B", "type": "no_mention", "why": "原文说的是不考虑「最佳服药时间」，不是不考虑「哪种药对哪个病人更好」。", "source": "P3 第1句"}, {"key": "C", "type": "polarity_flip", "why": "原文说多数药没被研究过 24 小时周期内的不同效果；C 反过来说医生会告诉患者 24 小时内的副作用。", "source": "P3 第3句"}, {"key": "D", "type": "concept_swap", "why": "原文的 compliance 指患者依从服药，不是「遵守药厂说明」，原文也没有药厂。", "source": "P3 第4句"}], "answer_evidence_para": 3, "paraphrase": [{"from": "rarely consider the best time to take it", "to": "give little thought to the time of taking it"}, {"from": "increase their effectiveness", "to": "for maximum effect"}, {"from": "prescribe medicine", "to": "prescribing medicine"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip", "concept_swap"], "difficulty": 2, "topic_zh": "医生开药时很少考虑最佳服药时间：不知情 + 没研究"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2025-12-S1-P1"}, {"schema_version": "1.0", "item_id": "2025-12-C-1-49", "source": {"exam": "2025-12", "set": 1, "section": "C", "passage_id": "P1", "question_no": 49}, "passage": {"text": "All living organisms on Earth are exposed to a 24-hour day-night cycle. This cycle is the reason why people rest at night and are active during the day. Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health. For example, eating at night can lead to weight gain over time because food intake at night leads to increased fat storage.\n\nMany drug targets in the body follow a 24-hour cycle, too. This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period. Because how the body responds to a drug can differ depending on the time it is taken, it logically follows that taking medicines at specific times could help increase their effectiveness and reduce unwanted side effects.\n\nWhen doctors prescribe medicine for people, they rarely consider the best time to take it. There are two main reasons for that oversight. First, many physicians are not aware that some drugs work better during a specific time of the day. And second, most drugs have not been studied for possible different effects during a 24- hour cycle. Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.\n\nOver 50 years ago, researchers found that the cholesterol drug simvastatin is more effective at lowering cholesterol levels when taken at night rather than during the day. This is because the liver enzyme these drugs target is more active at night.\n\nTaking medicine at the wrong time can even cause harm. My colleagues and I wondered whether midazolam, the most common sedative used in surgical procedures worldwide, might interfere with the internal clock that protects the heart at night. Currently, there are no guidelines regarding when midazolam should be administered.\n\nMore research is needed to determine the best times to administer treatments for different diseases. I believe taking drug timing into account could help make treatments more effective and help more people worldwide", "word_count": 344}, "stem": "Why do doctors advise patients to take most drugs in the morning or in the evening?", "options": [{"key": "A", "text": "To discourage them from making complaints."}, {"key": "B", "text": "To ensure they take the drugs as instructed."}, {"key": "C", "text": "To comply with new research findings strictly."}, {"key": "D", "text": "To guarantee the maximum effect of the drugs."}], "answer": "B", "explain": {"answer_evidence": "Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.", "wrong_options": [{"key": "A", "type": "no_mention", "why": "减少抱怨原文没提。", "source": "无（原文无对应）"}, {"key": "C", "type": "no_mention", "why": "原文正相反：多数药没被研究过 24 小时效果，谈不上「严格遵守新研究」。", "source": "P3 第3句"}, {"key": "D", "type": "polarity_flip", "why": "最大药效是「在正确时间服药」的目标；早晚服药的直接目的是依从性（compliance），D 把两件事混了。", "source": "P3 第4句"}], "answer_evidence_para": 3, "paraphrase": [{"from": "primarily to ensure compliance", "to": "to ensure they take the drugs as instructed"}, {"from": "patients are directed to take", "to": "doctors advise patients to take"}, {"from": "during the morning or evening", "to": "in the morning or in the evening"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip"], "difficulty": 2, "topic_zh": "早晚服药主要为保证依从性，不是为最大药效"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2025-12-S1-P1"}, {"schema_version": "1.0", "item_id": "2025-12-C-1-50", "source": {"exam": "2025-12", "set": 1, "section": "C", "passage_id": "P1", "question_no": 50}, "passage": {"text": "All living organisms on Earth are exposed to a 24-hour day-night cycle. This cycle is the reason why people rest at night and are active during the day. Consequently, all human body functions also follow this daily rhythm, and the timing of behaviors like exercise or food intake can significantly influence your health. For example, eating at night can lead to weight gain over time because food intake at night leads to increased fat storage.\n\nMany drug targets in the body follow a 24-hour cycle, too. This means that the specific proteins a drug is designed to modify can react differently to the medicine over the course of a 24-hour time period. Because how the body responds to a drug can differ depending on the time it is taken, it logically follows that taking medicines at specific times could help increase their effectiveness and reduce unwanted side effects.\n\nWhen doctors prescribe medicine for people, they rarely consider the best time to take it. There are two main reasons for that oversight. First, many physicians are not aware that some drugs work better during a specific time of the day. And second, most drugs have not been studied for possible different effects during a 24- hour cycle. Therefore, patients are directed to take most drugs during the morning or evening primarily to ensure compliance.\n\nOver 50 years ago, researchers found that the cholesterol drug simvastatin is more effective at lowering cholesterol levels when taken at night rather than during the day. This is because the liver enzyme these drugs target is more active at night.\n\nTaking medicine at the wrong time can even cause harm. My colleagues and I wondered whether midazolam, the most common sedative used in surgical procedures worldwide, might interfere with the internal clock that protects the heart at night. Currently, there are no guidelines regarding when midazolam should be administered.\n\nMore research is needed to determine the best times to administer treatments for different diseases. I believe taking drug timing into account could help make treatments more effective and help more people worldwide", "word_count": 344}, "stem": "What does the author suggest near the end of the passage?", "options": [{"key": "A", "text": "Considering drug-taking timing when prescribing drugs for patients."}, {"key": "B", "text": "Making treatments less complex by taking drug timing into account."}, {"key": "C", "text": "Conducting more studies to find out the best timing for treating different diseases."}, {"key": "D", "text": "Finding out the most effective drugs for treating diseases through further research."}], "answer": "C", "explain": {"answer_evidence": "More research is needed to determine the best times to administer treatments for different diseases.", "wrong_options": [{"key": "A", "type": "part_whole", "why": "「开药时考虑用药时间」是全文的主张，但末段的具体建议是「做更多研究确定最佳时间」，A 只说了一半。", "source": "P6 第1句"}, {"key": "B", "type": "no_mention", "why": "less complex（更简单）原文没提；原文是让治疗更有效。", "source": "无（原文无对应）"}, {"key": "D", "type": "off_topic", "why": "末段说的是找「最佳时间」，D 换成找「最有效的药」，答非所问。", "source": "P6 第1句"}], "answer_evidence_para": 6, "paraphrase": [{"from": "More research is needed to determine the best times to administer treatments", "to": "conducting more studies to find out the best timing"}, {"from": "for different diseases", "to": "for treating different diseases"}, {"from": "taking drug timing into account", "to": "considering drug-taking timing"}]}, "tags": {"question_type": "main_idea", "skills": ["locate", "summarize"], "distractor_types": ["part_whole", "no_mention", "off_topic"], "difficulty": 3, "top ect on retirement security, notes that quitting a career can lead to feelings of isolation and loneliness, particularly for men. He suggests that many college-educated workers are choosing to stay in the labor force more for social benefits than for financial reasons. They're also more likely to be in professional occupations where they tend to enjoy their work more.\n\nWorkers in more physical jobs, meanwhile, may be more likely to look forward to retiring, Baily says, suggesting those who stay on are more likely doing so for financial reasons", "word_count": 346}, "stem": "What do we learn from the passage about the economics professor and her hairdresser?", "options": [{"key": "A", "text": "They differ in their reasons for continuing to work."}, {"key": "B", "text": "They are both committed to working into their 70s."}, {"key": "C", "text": "They are happy about their current financial situation."}, {"key": "D", "text": "They hold different views about postponing retirement."}], "answer": "A", "explain": {"answer_evidence": "The economist said she plans to continue working because she wants to. The hairdresser agreed but for a different reason: She needs the money.", "wrong_options": [{"key": "B", "type": "no_mention", "why": "两人都说要接着干，但「committed to working into their 70s」把意向夸成承诺，原文没说干到 70 多岁。", "source": "P1 第2–3句"}, {"key": "C", "type": "no_mention", "why": "理发师需要钱，谈不上对财务状况满意。", "source": "P1 第3句"}, {"key": "D", "type": "polarity_flip", "why": "两人对「继续工作」意见一致（agreed），只是理由不同；D 说他们对推迟退休看法不同。", "source": "P1 第2–3句"}], "answer_evidence_para": 1, "paraphrase": [{"from": "because she wants to", "to": "for one reason"}, {"from": "She needs the money", "to": "for a different reason"}, {"from": "agreed but for a different reason", "to": "differ in their reasons"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip"], "difficulty": 2, "topic_zh": "教授想干、理发师缺钱：同样继续工作，理由不同"}, "provenance": {"model": "d lor's degrees who were working into their 70s reached nearly 20% in 2018. For those with a high school degree or less, the proportion of those working in their 70s had risen to around 10%, while those with some college education were in the middle at around 15%.\n\nMartin Neil Baily, an economist who is leading a research project on retirement security, notes that quitting a career can lead to feelings of isolation and loneliness, particularly for men. He suggests that many college-educated workers are choosing to stay in the labor force more for social benefits than for financial reasons. They're also more likely to be in professional occupations where they tend to enjoy their work more.\n\nWorkers in more physical jobs, meanwhile, may be more likely to look forward to retiring, Baily says, suggesting those who stay on are more likely doing so for financial reasons", "word_count": 346}, "stem": "What does the passage say about people doing manual work?", "options": [{"key": "A", "text": "They are eager to enjoy life after retiring."}, {"key": "B", "text": "They are likely to have financial troubles."}, {"key": "C", "text": "They generally don't enjoy doing it."}, {"key": "D", "text": "They tend to anticipate retirement."}], "answer": "D", "explain": {"answer_evidence": "Workers in more physical jobs, meanwhile, may be more likely to look forward to retiring", "wrong_options": [{"key": "A", "type": "concept_swap", "why": "原文是 look forward to retiring（期待退休），A 添了「享受退休后的生活」，把期待退休改写成对退休生活的想象。", "source": "P7 第1句"}, {"key": "B", "type": "no_mention", "why": "原文只说继续干的人更可能是为钱，没说体力劳动者有财务困难。", "source": "P7 第1句"}, {"key": "C", "type": "no_mention", "why": "他们喜不喜欢体力活原文没提。", "source": "无（原文无对应）"}], "answer_evidence_para": 7, "paraphrase": [{"from": "Workers in more physical jobs", "to": "people doing manual work"}, {"from": "may be more likely to look forward to retiring", "to": "tend to anticipate retirement"}, {"from": "more physical jobs", "to": "manual work"}]}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["concept_swap", "no_mention"], "difficulty": 2, "topic_zh": "体力劳动者更期待退休"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2025-12-S1-P2"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-46", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P1", "question_no": 46}, "passage": {"text": "Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.\n\nWhether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.\n\nScience won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.\n\nOne thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.\n\nOrganic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.\n\nIn fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.\n\nThe use of animal waste in organic agriculture can also be a factor in the spread of bacteria like E. coli and salmonella. Over the past 10 years, Canada has seen more food-safety recalls for organic products, proportionally, than for conventional products.\n\nOn the whole, organic agriculture may have a smaller environmental footprint. That's mostly because the risk of groundwater contamination from organic farming is lower. Organic farmers never used neonics, the controversial pesticides that have been linked to shrinking bee populations worldwide.\n\nTraditional agriculture has been making \"dramatic improvements\" to reduce its impact on the environment.\n\nIt isn't a black-and-white picture, though.\n\nOrganic farming is much less efficient when it comes to land use, although yields vary considerably depending on the crop.\n\nOn the other hand, advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture", "word_count": 347}, "stem": "What is the classic grocery store dilemma?", "options": [{"key": "A", "text": "Whether or not one should eat organic food."}, {"key": "B", "text": "Whether or not one can stretch their wallet far."}, {"key": "C", "text": "Organic food costs more but it certainly tastes better."}, {"key": "D", "text": "One wants the best food but their budget is limited."}], "answer": "D", "explain": {"answer_evidence": "On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.", "wrong_options": [{"key": "A", "type": "part_whole", "why": "把全文的话题（要不要买有机食品）当成第一段的「超市经典困境」；困境是想要最好与预算有限的两难，不是买不买。", "source": "P2 第1句（全文话题）"}, {"key": "B", "type": "concept_swap", "why": "只取了「钱包能撑多远」这一半，把它当成整个困境；原文是两难对照，不是单问预算。", "source": "P1 第3–4句"}, {"key": "C", "type": "no_mention", "why": "tastes better 原文从未比较味道，纯属无中生有。", "source": "无（原文无对应）"}], "paraphrase": [{"from": "your family dinner table deserves only the best", "to": "one wants the best food"}, {"from": "your wallet can only stretch so far", "to": "their budget is limited"}, {"from": "the classic grocery store dilemma", "to": "a difficult choice at the store"}], "answer_evidence_para": 1}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["part_whole", "concept_swap", "no_mention"], "difficulty": 2, "topic_zh": "有机食品第一个困境：想要最好 vs 预算有限"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-47", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P1", "question_no": 47}, "passage": {"text": "Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.\n\nWhether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.\n\nScience won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.\n\nOne thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.\n\nOrganic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.\n\nIn fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.\n\nThe use of animal waste in organic agriculture can also be a factor in the spread of bacteria like E. coli and salmonella. Over the past 10 years, Canada has seen more food-safety recalls for organic products, proportionally, than for conventional products.\n\nOn the whole, organic agriculture may have a smaller environmental footprint. That's mostly because the risk of groundwater contamination from organic farming is lower. Organic farmers never used neonics, the controversial pesticides that have been linked to shrinking bee populations worldwide.\n\nTraditional agriculture has been making \"dramatic improvements\" to reduce its impact on the environment.\n\nIt isn't a black-and-white picture, though.\n\nOrganic farming is much less efficient when it comes to land use, although yields vary considerably depending on the crop.\n\nOn the other hand, advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture", "word_count": 347}, "stem": "What do we learn about organic food from science?", "options": [{"key": "A", "text": "Whether it is any better remains uncertain."}, {"key": "B", "text": "Whether it is healthier is under consideration."}, {"key": "C", "text": "Whether it is more nutritious than conventional food is arguable."}, {"key": "D", "text": "Whether it is going to replace conventional food is still unclear."}], "answer": "A", "explain": {"answer_evidence": "Science won't give a clear-cut answer to the question of whether organic food is \"better.\"", "wrong_options": [{"key": "B", "type": "no_mention", "why": "原文说科学不给明确答案，不是「正在考虑/研究中」；且 healthier 与 P4 的 equally nutritious 相矛盾。", "source": "P4 第1句"}, {"key": "C", "type": "polarity_flip", "why": "P4 明说「One thing is definitive: ... equally nutritious」，营养上没差别是定论，不是 arguable。", "source": "P4 第1句"}, {"key": "D", "type": "no_mention", "why": "replace conventional food 全文未提。", "source": "无（原文无对应）"}], "paraphrase": [{"from": "won't give a clear-cut answer", "to": "remains uncertain"}, {"from": "whether organic food is \"better.\"", "to": "whether it is any better"}, {"from": "trade-offs ... answers become less definitive", "to": "no clear-cut answer"}], "answer_evidence_para": 3}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip"], "difficulty": 2, "topic_zh": "科学给不出「有机是否更好」的定论"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-48", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P1", "question_no": 48}, "passage": {"text": "Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.\n\nWhether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.\n\nScience won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.\n\nOne thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.\n\nOrganic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.\n\nIn fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.\n\nThe use of animal waste in organic  Even organic growers use pesticides，两者都用，C 说一个用一个不用。", "source": "P5 第3句"}], "paraphrase": [{"from": "no big difference", "to": "no substantial difference"}, {"from": "from a food-safety perspective", "to": "as far as food safety is concerned"}, {"from": "organic and non-organic products", "to": "the two"}], "answer_evidence_para": 5}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["literal_trap", "polarity_flip"], "difficulty": 2, "topic_zh": "食品安全角度：有机与非有机差别不大"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-49", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P1", "question_no": 49}, "passage": {"text": "Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.\n\nWhether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.\n\nScience won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.\n\nOne thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.\n\nOrganic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.\n\nIn fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.\n\nThe use of animal waste in organic agriculture can also be a factor in the spread of bacteria like E. coli and salmonella. Over the past 10 years, Canada has seen more food-safety recalls for organic products, proportionally, than for conventional products.\n\nOn the whole, organic agriculture may have a smaller environmental footprint. That's mostly because the risk of groundwater contamination from organic farming is lower. Organic farmers never used neonics, the controversial pesticides that have been linked to shrinking bee populations worldwide.\n\nTraditional agriculture has been making \"dramatic improvements\" to reduce its impact on the environment.\n\nIt isn't a black-and-white picture, though.\n\nOrganic farming is much less efficient when it comes to land use, although yields vary considerably depending on the crop.\n\nOn the other hand, advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture", "word_count": 347}, "stem": "What does the author say about organic farming?", "options": [{"key": "A", "text": "It may be blamed for the shrinking bee populations in the world."}, {"key": "B", "text": "It minimizes the use of controversial pesticides in its operations."}, {"key": "C", "text": "It may impact the environment less than conventional farming."}, {"key": "D", "text": "It contaminates groundwater as much as conventional farming."}], "answer": "C", "explain": {"answer_evidence": "On the whole, organic agriculture may have a smaller environmental footprint.", "wrong_options": [{"key": "A", "type": "polarity_flip", "why": "P8 说有机农民从不使用 neonics，而正是 neonics 被指与蜜蜂减少有关；A 把责任反扣到有机农业头上。", "source": "P8 第3句"}, {"key": "B", "type": "concept_swap", "why": "原文只说「never used neonics」这一种农药，且 P6 说有机农民农药用量更大；B 扩成「最小化有争议农药使用」。", "source": "P8 第3句 / P6 第1句"}, {"key": "D", "type": "polarity_flip", "why": "P8 说有机农业造成地下水污染的风险更低，D 说一样多。", "source": "P8 第2句"}], "paraphrase": [{"from": "smaller environmental footprint", "to": "impact the environment less"}, {"from": "the risk of groundwater contamination from organic farming is lower", "to": "contaminates groundwater less"}, {"from": "never used neonics", "to": "does not use the pesticides blamed for bees"}], "answer_evidence_para": 8}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["polarity_flip", "concept_swap"], "difficulty": 2, "topic_zh": "有机农业整体环境足迹更小，但也不是黑白分明"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-50", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P1", "question_no": 50}, "passage": {"text": "Is organic food worth the higher price? It's the classic grocery store dilemma. On the one hand, your family dinner table deserves only the best. On the other hand, your wallet can only stretch so far.\n\nWhether or not to buy organic is a personal decision, said Mike von Massow, professor of Food Agriculture.\n\nScience won't give a clear-cut answer to the question of whether organic food is \"better.\" There are often trade-offs and answers become less definitive depending on the product under consideration.\n\nOne thing is definitive: Organic and conventionally grown food are equally nutritious. From a nutrition point of view, there is no difference between organic and traditionally grown products.\n\nOrganic products don't necessarily have fewer pesticides—in fact, they may have more. There is also no big difference between organic and non-organic products from a food-safety perspective. Even organic growers use pesticides. Testing shows little if any pesticide remains on conventionally grown products.\n\nIn fact, organic farmers often use larger quantities of pesticide because they can only use the natural variety of insect-killers. Chemical pesticides generally kill a much wider range of pests than any single natural pesticide.\n\nThe use of animal waste in organic agriculture can also be a factor in the spread of bacteria like E. coli and salmonella. Over the past 10 years, Canada has seen more food-safety recalls for organic products, proportionally, than for conventional products.\n\nOn the whole, organic agriculture may have a smaller environmental footprint. That's mostly because the risk of groundwater contamination from organic farming is lower. Organic farmers never used neonics, the controversial pesticides that have been linked to shrinking bee populations worldwide.\n\nTraditional agriculture has been making \"dramatic improvements\" to reduce its impact on the environment.\n\nIt isn't a black-and-white picture, though.\n\nOrganic farming is much less efficient when it comes to land use, although yields vary considerably depending on the crop.\n\nOn the other hand, advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture", "word_count": 347}, "stem": "What do advocates of organic farming argue about its yields and efficiency?", "options": [{"key": "A", "text": "They would increase quickly with the emergence of new technologies."}, {"key": "B", "text": "They would improve remarkably with more research and investment."}, {"key": "C", "text": "They would be achieved along with enormous health benefits."}, {"key": "D", "text": "They would considerably lower the cost to the environment."}], "answer": "B", "explain": {"answer_evidence": "advocates of organic farming argue yields and efficiency could be significantly improved if the food industry devoted as much research and money to organic farming as it does conventional agriculture", "wrong_options": [{"key": "A", "type": "no_mention", "why": "new technologies 全文没提。", "source": "无（原文无对应）"}, {"key": "C", "type": "no_mention", "why": "health benefits 没提。", "source": "无（原文无对应）"}, {"key": "D", "type": "off_topic", "why": "environmental footprint 是 P8 的话题，不是 advocates 对产量与效率的主张。", "source": "P8 第1句"}], "paraphrase": [{"from": "devoted as much research and money", "to": "more research and investment"}, {"from": "could be significantly improved", "to": "improve remarkably"}, {"from": "yields and efficiency", "to": "they"}], "answer_evidence_para": 12}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "off_topic"], "difficulty": 2, "topic_zh": "有机农业支持者：投入更多研究与资金，产量和效率能显著提高"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-51", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P2", "question_no": 51}, "passage": {"text": "It is still controversial whether we are fundamentally generous or selfish and whether these tendencies are shaped by our genes or environment.\n\nSome evidence points to humans being born cooperative. At later stages in life we routinely work together to reach goals and help out in times of need.\n\nYet instances of selfish behavior are also plenty. One recent study tested people's willingness to set aside selfish interests to reach a greater good. It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however. Another study showed that players who cooperated did better in the long run.\n\nIt seems that human nature supports both pro-social and selfish traits. Genetic studies have made some progress toward identifying their biological roots. By comparing identical twins, who share nearly 100 percent of their genes, and non-identical twins, who share about half, researchers have found overwhelming evidence for genetic effects on behaviors. In these twin studies, identical and non-identical twins are asked, for example, to split a sum of money with a peer. Such studies often also rely on careful psychological assessments and DNA analysis.\n\nOther work highlights specific genes as key players. My colleagues and I recently identified a gene linked to altruistic behavior and found that a particular variant of it was associated with more selfish behavior in preschoolers.\n\nAccording to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line. As communities diversified, mutual support could have broadened to include individuals not linked by blood. Another possibility is that humans cooperate to gain some advantage, such as boosting reputation. Finally, evolutionary processes take place at the group level. Groups of highly cooperative individuals have higher chances of survival because they can work together to reach goals that are unattainable to less cooperative groups.\n\nYet almost no behavior is entirely genetic, even among identical twins. Culture, schooling and parenting are important determinants of cooperation. Thus, the degree to which we act cooperatively or selfishly is unique to each individual and depends on a variety of genetic and environmental influences", "word_count": 349}, "stem": "What is the finding of one recent study about being selfish?", "options": [{"key": "A", "text": "It may bring certain benefits in the short term."}, {"key": "B", "text": "It usually yields more disadvantages than advantages."}, {"key": "C", "text": "It serves individual interest rather than a collective's."}, {"key": "D", "text": "It may give way to cooperating in the long run."}], "answer": "A", "explain": {"answer_evidence": "It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however.", "wrong_options": [{"key": "B", "type": "polarity_flip", "why": "研究结论是自私「更有利」，只是好处可能短暂；B 反过来说弊大于利。", "source": "P3 第3句"}, {"key": "C", "type": "off_topic", "why": "这是在解释 selfish 的含义（个人利益 vs 集体），不是该研究的发现。", "source": "P3 第2句"}, {"key": "D", "type": "concept_swap", "why": "长期表现更好的是「合作」（Another study showed players who cooperated did better in the long run），不是自私给合作让路。", "source": "P3 第5句"}], "paraphrase": [{"from": "being selfish was more advantageous", "to": "may bring certain benefits"}, {"from": "The benefit may be short-lived", "to": "in the short term"}, {"from": "more advantageous than cooperating", "to": "benefits"}], "answer_evidence_para": 3}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["polarity_flip", "off_topic", "concept_swap"], "difficulty": 2, "topic_zh": "自私短期占优，但好处可能短暂"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P2"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-52", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P2", "question_no": 52}, "passage": {"text": "It is still controversial whether we are fundamentally generous or selfish and whether these tendencies are shaped by our genes or environment.\n\nSome evidence points to humans being born cooperative. At later stages in life we routinely work together to reach goals and help out in times of need.\n\nYet instances of selfish behavior are also plenty. One recent study tested people's willingness to set aside selfish interests to reach a greater good. It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however. Another study showed that players who cooperated did better in the long run.\n\nIt seems that human nature supports both pro-social and selfish traits. Genetic studies have made some progress toward identifying their biological roots. By comparing identical twins, who share nearly 100 percent of their genes, and non-identical twins, who share about half, researchers have found overwhelming evidence for genetic effects on behaviors. In these twin studies, identical and non-identical twins are asked, for example, to split a sum of money with a peer. Such studies often also rely on careful psychological assessments and DNA analysis.\n\nOther work highlights specific genes as key players. My colleagues and I recently identified a gene linked to altruistic behavior and found that a particular variant of it was associated with more selfish behavior in preschoolers.\n\nAccording to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line. As communities diversified, mutual support could have broadened to include individuals not linked by blood. Another possibility is that humans cooperate to gain some advantage, such as boosting reputation. Finally, evolutionary processes take place at the group level. Groups of highly cooperative individuals have higher chances of survival because they can work together to reach goals that are unattainable to less cooperative groups.\n\nYet almost no behavior is entirely genetic, even among identical twins. Culture, schooling and parenting are important determinants of cooperation. Thus, the degree to which we act cooperatively or selfishly is unique to each individual and depends on a variety of genetic and environmental influences", "word_count": 349}, "stem": "What have researchers found by studying identical and non-identical twins?", "options": [{"key": "A", "text": "They are overwhelmingly different in the amounts of genes."}, {"key": "B", "text": "One's behavior is largely determined by their genetic traits."}, {"key": "C", "text": "One's biological roots can be identified by their genes."}, {"key": "
