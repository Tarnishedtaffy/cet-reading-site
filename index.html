d help out in times of need.\n\nYet instances of selfish behavior are also plenty. One recent study tested people's willingness to set aside selfish interests to reach a greater good. It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however. Another study showed that players who cooperated did better in the long run.\n\nIt seems that human nature supports both pro-social and selfish traits. Genetic studies have made some progress toward identifying their biological roots. By comparing identical twins, who share nearly 100 percent of their genes, and non-identical twins, who share about half, researchers have found overwhelming evidence for genetic effects on behaviors. In these twin studies, identical and non-identical twins are asked, for example, to split a sum of money with a peer. Such studies often also rely on careful psychological assessments and DNA analysis.\n\nOther work highlights specific genes as key players. My colleagues and I recently identified a gene linked to altruistic behavior and found that a particular variant of it was associated with more selfish behavior in preschoolers.\n\nAccording to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line. As communities diversified, mutual support could have broadened to include individuals not linked by blood. Another possibility is that humans cooperate to gain some advantage, such as boosting reputation. Finally, evolutionary processes take place at the group level. Groups of highly cooperative individuals have higher chances of survival because they can work together to reach goals that are unattainable to less cooperative groups.\n\nYet almost no behavior is entirely genetic, even among identical twins. Culture, schooling and parenting are important determinants of cooperation. Thus, the degree to which we act cooperatively or selfishly is unique to each individual and depends on a variety of genetic and environmental influences", "word_count": 349}, "stem": "What do we learn from evolutionary scientists about cooperative behavior?", "options": [{"key": "A", "text": "It may have initially originated in individuals linked by blood."}, {"key": "B", "text": "It may have caused the diversification of communities."}, {"key": "C", "text": "It helps to build relationships among blood-related people."}, {"key": "D", "text": "It guarantees the achievement of goals otherwise unattainable."}], "answer": "A", "explain": {"answer_evidence": "According to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line.", "wrong_options": [{"key": "B", "type": "polarity_flip", "why": "原文是 communities diversified（社区多样化）之后合作范围才扩大，B 把因果倒过来了。", "source": "P6 第2句"}, {"key": "C", "type": "concept_swap", "why": "合作是在亲属间先演化以延续基因，不是用来「建立亲属关系」。", "source": "P6 第1句"}, {"key": "D", "type": "absolute", "why": "原文说合作群体「higher chances of survival」（更可能），D 说 guarantees（保证），绝对化。", "source": "P6 第4句"}], "paraphrase": [{"from": "evolved first among relatives", "to": "initially originated in individuals linked by blood"}, {"from": "to promote the continuation of their genetic line", "to": "linked by blood"}, {"from": "According to evolutionary scientists", "to": "we learn from"}], "answer_evidence_para": 6}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["polarity_flip", "concept_swap", "absolute"], "difficulty": 2, "topic_zh": "合作先在亲属间演化以延续基因"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P2"}, {"schema_version": "1.0", "item_id": "2026-06-C-1-55", "source": {"exam": "2026-06", "set": 1, "section": "C", "passage_id": "P2", "question_no": 55}, "passage": {"text": "It is still controversial whether we are fundamentally generous or selfish and whether these tendencies are shaped by our genes or environment.\n\nSome evidence points to humans being born cooperative. At later stages in life we routinely work together to reach goals and help out in times of need.\n\nYet instances of selfish behavior are also plenty. One recent study tested people's willingness to set aside selfish interests to reach a greater good. It found that being selfish was more advantageous than cooperating. The benefit may be short-lived, however. Another study showed that players who cooperated did better in the long run.\n\nIt seems that human nature supports both pro-social and selfish traits. Genetic studies have made some progress toward identifying their biological roots. By comparing identical twins, who share nearly 100 percent of their genes, and non-identical twins, who share about half, researchers have found overwhelming evidence for genetic effects on behaviors. In these twin studies, identical and non-identical twins are asked, for example, to split a sum of money with a peer. Such studies often also rely on careful psychological assessments and DNA analysis.\n\nOther work highlights specific genes as key players. My colleagues and I recently identified a gene linked to altruistic behavior and found that a particular variant of it was associated with more selfish behavior in preschoolers.\n\nAccording to evolutionary scientists, cooperative behavior may have evolved first among relatives to promote the continuation of their genetic line. As communities diversified, mutual support could have broadened to include individuals not linked by blood. Another possibility is that humans cooperate to gain some advantage, such as boosting reputation. Finally, evolutionary processes take place at the group level. Groups of highly cooperative individuals have higher chances of survival because they can work together to reach goals that are unattainable to less cooperative groups.\n\nYet almost no behavior is entirely genetic, even among identical twins. Culture, schooling and parenting are important determinants of cooperation. Thus, the degree to which we act cooperatively or selfishly is unique to each individual and depends on a variety of genetic and environmental influences", "word_count": 349}, "stem": "What can we infer from the last paragraph?", "options": [{"key": "A", "text": "Cooperative behavior is evident among identical twins."}, {"key": "B", "text": "One is born either cooperative or non-cooperative."}, {"key": "C", "text": "Genes determine one's tendency to cooperate."}, {"key": "D", "text": "Cooperative behavior may be cultivated."}], "answer": "D", "explain": {"answer_evidence": "Culture, schooling and parenting are important determinants of cooperation.", "wrong_options": [{"key": "A", "type": "no_mention", "why": "最后一段只说「即使同卵双胞胎也几乎没有行为完全由基因决定」，没说合作行为在同卵双胞胎中很明显。", "source": "P7 第1句"}, {"key": "B", "type": "polarity_flip", "why": "P2 说人可能天生合作，P7 又说并非基因定死；B 把「天生」与「非此即彼」捆在一起，与末段相反。", "source": "P2 第1句 / P7 第1句"}, {"key": "C", "type": "polarity_flip", "why": "P7 明说 almost no behavior is entirely genetic，C 说基因决定，正反颠倒。", "source": "P7 第1句"}], "paraphrase": [{"from": "Culture, schooling and parenting are important determinants", "to": "may be cultivated"}, {"from": "not entirely genetic", "to": "not fixed at birth"}, {"from": "depends on a variety of genetic and environmental influences", "to": "genes do not determine"}], "answer_evidence_para": 7}, "tags": {"question_type": "inference", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip"], "difficulty": 3, "topic_zh": "合作可以被后天培养（文化、学校教育、养育）"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:20:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S1-P2"}, {"schema_version": "1.0", "item_id": "2026-06-C-3-46", "source": {"exam": "2026-06", "set": 3, "section": "C", "passage_id": "P1", "question_no": 46}, "passage": {"text": "Disgust is a universal human emotion. One type of disgust is called physical disgust, which protects us from eating or touching things that could be dangerous for us, such as raw meat or insects. Children experience physical disgust from a very early age, but do not achieve an understanding of the concept until they are around four years old.\n\nSome researchers maintain that there is another type of disgust, called moral disgust, that protects us from engaging in activities that can be perceived as morally wrong. Examples of moral disgust are stealing, lying or cheating.\n\nHowever, not all academics think that moral disgust really exists. Some say that when we refer to disgust in relation to moral issues, we are using disgust as a metaphor, and what we are feeling is in reality anger.\n\nIf moral disgust appears quite late in development, it makes sense to think that there is actually a social component to it. Children learn about emotions in many different ways. Of special relevance are parents-children conversations about emotions. Indeed, children whose parents talk about emotions often have a better emotional understanding than children whose parents do not discuss emotions often.\n\nHowever, there are no studies that have examined how parents and children talk about disgust. This is what we set up to examine in our study.\n\nWe asked 68 English-speaking mothers and their four-, six- or eight-year-old children to discuss some stories about moral and physical disgust. Our preliminary findings show mothers and children do talk about disgust, but mainly about physical disgust and not so much about moral disgust.\n\nWhen we asked mothers and children to discuss moral issues, such as whether it is OK to play with a child who has stolen someone else's snack, they linked this type of moral wrongdoing with the emotion of anger and not disgust.\n\nDoes this mean that moral disgust does not exist? Some researchers suggest moral disgust exists in adults. Our findings suggest that moral disgust is either understood at a later age or is only used metaphorically, if at all, in children as old as eight years.", "word_count": 350}, "stem": "What does the passage tell us about physical disgust?", "options": [{"key": "A", "text": "It is an emotion as contrasted with thoughts."}, {"key": "B", "text": "It is a concept beyond children's understanding."}, {"key": "C", "text": "It is a mechanism to keep us from being harmed."}, {"key": "D", "text": "It is an experience gained from any form of danger."}], "answer": "C", "explain": {"answer_evidence": "One type of disgust is called physical disgust, which protects us from eating or touching things that could be dangerous for us", "wrong_options": [{"key": "A", "type": "no_mention", "why": "原文从未把厌恶与「思想/思考」对照，这个对立是凭空加的。", "source": "无（P1–P8 均无 thought 对立）"}, {"key": "B", "type": "polarity_flip", "why": "原文说四岁左右才「理解」这个概念（即之前不懂、之后懂），B 反过来说孩子永远不懂。", "source": "P1 第3句"}, {"key": "D", "type": "concept_swap", "why": "原文限定「可能危险的东西」，D 扩成 any form of danger，还把「保护机制」换成「从危险中获得的经验」。", "source": "P1 第2句"}], "paraphrase": [{"from": "protects us from", "to": "keep us from"}, {"from": "eating or touching things that could be dangerous for us", "to": "being harmed"}, {"from": "physical disgust", "to": "a mechanism"}], "answer_evidence_para": 1}, "tags": {"question_type": "detail", "skills": ["locate", "paraphrase"], "distractor_types": ["no_mention", "polarity_flip", "concept_swap"], "difficulty": 2, "topic_zh": "生理厌恶的功能：把可能有害的东西挡在外面"}, "provenance": {"model": "deepseek-flash", "produced_at": "2026-11-08T22:05:00+08:00", "self_check": {"evidence_found": true}, "human_verified": false}, "passage_key": "2026-06-S3-P1"}, {"schema_version": "1.0", "item_id": "2026-06-C-3-47", "source": {"exam": "2026-06", "set": 3, "section": "C", "passage_id": "P1", "question_no": 47}, "passage": {"text": "Disgust is a universal human emotion. One type of disgust is called physical disgust, which protects us from eating or touching things that could be dangerous for us, such as raw meat or insects. Children experience physical disgust from a very early age, but do not achieve an understanding of the concept until they are around four years old.\n\nSome researchers maintain that there is another type of disgust, called moral disgust, that protects us from engaging in activities that can be perceived as morally wrong. Examples of moral disgust are stealing, lying or cheating.\n\nHowever, not all academics think that moral disgust really exists. Some say that when we refer to disgust in relation to moral issues, we are using disgust as a metaphor, and what we are feeling is in reality anger.\n\nIf moral disgust appears quite late in development, it makes sense to think that there is actually a social component to it. Children learn about emotions in many different ways. Of special relevance are parents-children conversations about emotions. Indeed, children whose parents talk about emotions often have a better emotional understanding than children whose parents do not discuss emotions often.\n\nHowever, there are no studies that have examined how parents and children talk about disgust. This is what we set up to examine in our study.\n\nWe asked 68 English-speaking mothers and their four-, six- or eight-year-old children to discuss some stories about moral and physical disgust. Our preliminary findings show mothers and children do talk about disgust, but mainly about physical disgust and not so much about moral disgust.\n\nWhen we asked mothers and children to discuss moral issues, such as whether it is OK to play with a child who has stolen someone else's snack, they linked this type of moral wrongdoing with the emotion of anger and not disgust.\n\nDoes this mean that moral disgust does not exist? Some researchers suggest moral disgust exists in adults. Our findings suggest that moral disgust is either understood at a later age or is only used metaphorically, if at all, in chi tects us from eating or touching things that could be dangerous for us, such as raw meat or insects. Children experience physical disgust from a very early age, but do not achieve an understanding of the concept until they are around four years old.\n\nSome researchers maintain that there is another type of disgust, called moral disgust, that protects us from engaging in activities that can be perceived as morally wrong. Examples of moral disgust are stealing, lying or cheating.\n\nHowever, not all academics think that moral disgust really exists. Some say that when we refer to disgust in relation to moral issues, we are using disgust as a metaphor, and what we are feeling is in reality anger.\n\nIf moral disgust appears quite late in development, it makes sense to think that there is actually a social component to it. Children learn about emotions in many different ways. Of special relevance are parents-children conversations about emotions. Indeed, children whose parents talk about emotions often have a better emotional understanding than children whose parents do not discuss emotions often.\n\nHowever, there are no studies that have examined how parents and children talk about disgust. This is what we set up to examine in our study.\n\nWe asked 68 English-speaking mothers and their four-, six- or eight-year-old children to discuss some stories about moral and physical disgust. Our preliminary findings show mothers and children do talk about disgust, but mainly about physical disgust and not so much about moral disgust.\n\nWhen we asked mothers and children to discuss moral issues, such as whether it is OK to play with a child who has stolen someone else's snack, they linked this type of moral wrongdoing with the emotion of anger and not disgust.\n\nDoes this mean that moral disgust does not exist? Some researchers suggest moral disgust exists in adults. Our findings suggest that moral disgust is either understood at a later age or is only used metaphorically, if  know about us. As a result, we act more honestly around them, according to a recent study in Nature.\n\nPast research has found that we tend to assume social relationships are reciprocal. Most of the time, this assumption is accurate: someone you think of as a friend will usually consider you a friend too. But sometimes our social ties are more one-sided: for example, you might learn something about a stranger who doesn't know you at all. Researchers Anuj Shah and Michael LaForest wondered whether our tendency to believe that social ties are reciprocal could lead us to mistakenly feel that a stranger does actually know us.\n\nIn a series of lab-based studies, this is exactly what the researchers found. When we know about strangers, we erroneously think they also know about us. But the really interesting finding came when the researchers stepped out of the lab, to conduct a field experiment. The team developed leaflets containing fairly ordinary information about local community police officers, such as their favourite food, hobbies, or reasons for joining the police force. They then sent out these leaflets to every apartment in a number of housing developments in disadvantaged areas. The officers themselves also dropped off cards to local residents containing similar information.\n\nTwo months later, the researchers surveyed residents at these housing developments as well as control areas that did not receive leaflets or outreach cards. Residents were asked to imagine that they had committed a crime and how likely it would be that local officers would find out about it. They also rated how well the officers in the area knew them.\n\nThe team found that residents of the developments that had received the leaflets believed it more likely that local officers would find out about illegal activity than residents of the control areas. Even more strikingly, the team found that immediately after the leaflet distribution, there were fewer criminal complaints and arrests in , we mistakenly think that they also know about us. As a result, we act more honestly around them, according to a recent study in Nature.\n\nPast research has found that we tend to assume social relationships are reciprocal. Most of the time, this assumption is accurate: someone you think of as a friend will usually consider you a friend too. But sometimes our social ties are more one-sided: for example, you might learn something about a stranger who doesn't know you at all. Researchers Anuj Shah and Michael LaForest wondered whether our tendency to believe that social ties are reciprocal could lead us to mistakenly feel that a stranger does actually know us.\n\nIn a series of lab-based studies, this is exactly what the researchers found. When we know about strangers, we erroneously think they also know about us. But the really interesting finding came when the researchers stepped out of the lab, to conduct a field experiment. The team developed leaflets containing fairly ordinary information about local community police officers, such as their favourite food, hobbies, or reasons for joining the police force. They then sent out these leaflets to every apartment in a number of housing developments in disadvantaged areas. The officers themselves also dropped off cards to local residents containing similar information.\n\nTwo months later, the researchers surveyed residents at these housing developments as well as control areas that did not receive leaflets or outreach cards. Residents were asked to imagine that they had committed a crime and how likely it would be that local officers would find out about it. They also rated how well the officers in the area knew them.\n\nThe team found that residents of the developments that had received the leaflets believed it more likely that local officers would find out about illegal activity than residents of the control areas. Even more strikingly, the team found that immediately after the leaflet distribution, there were fewer <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const TYPES = {detail:'细节题',inference:'推断题',main_idea:'主旨题',vocab_guess:'词义题',attitude:'态度题',example:'例证题',reference:'指代题',structure:'结构题',calculation:'计算题'};
const TRAPS = {no_mention:'无中生有',concept_swap:'偷换概念',polarity_flip:'正反颠倒',over_inference:'过度推断',part_whole:'以偏概全',
  time_place_shift:'时地错位',attribution:'张冠李戴',absolute:'绝对化',off_topic:'答非所问',literal_trap:'字面陷阱',degree_shift:'程度偏移'};
const TRAP_DEF = {
  no_mention:'原文根本没提，靠常识或主观臆想捏造。',
  concept_swap:'保留原文部分词汇，动作、修饰或对象被悄悄换掉。',
  polarity_flip:'用反义词或否定词把作者态度整个倒过来。',
  over_inference:'原文只给线索，选项把它推成确定结论。',
  part_whole:'拿某一小部分当整体，或以单例代替全局。',
  time_place_shift:'把时间、地点、阶段挪到别处。',
  attribution:'把甲的观点、行为安到乙头上。',
  absolute:'加 all/only/never 一类绝对限定，超出原文。',
  off_topic:'答得没错，但问的不是这回事。',
  literal_trap:'照字面直译，忽略上下文里的反讽或引申。',
  degree_shift:'方向对，程度被放大或缩小。'
};
const TRAP_ORDER = Object.keys(TRAPS);
const ITEMS = DATA.items, PASS = DATA.passages;
const state = {q:'', f:{exam:'',type:'',diff:'',trap:''}, cur:null, view:'q'};

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\s+/g,' ').trim();

function matches(it){
  if(state.f.exam && it.source.exam !== state.f.exam) return false;
  if(state.f.type && it.tags.question_type !== state.f.type) return false;
  if(state.f.diff && String(it.tags.difficulty) !== state.f.diff) return false;
  if(state.f.trap && !it.tags.distractor_types.includes(state.f.trap)) return false;
  if(!state.q) return true;
  const hay = [it.stem, ...it.options.map(o=>o.text), it.passage.text, (it.tags.topic_zh||'')].join(' ').toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

function renderFilters(){
  const exams = [...new Set(ITEMS.map(i=>i.source.exam))].sort();
  const diffs = [...new Set(ITEMS.map(i=>i.tags.difficulty))].sort();
  const groups = [
    ['套卷','exam', exams.map(v=>[v,v])],
    ['题型','type', Object.keys(TYPES).map(k=>[k,TYPES[k]])],
    ['难度','diff', diffs.map(v=>[String(v), '★'.repeat(v)])],
    ['陷阱','trap', TRAP_ORDER.map(k=>[k,TRAPS[k]])]
  ];
  $('#filters').innerHTML = groups.map(([label,key,opts],i)=>`
    <details ${i===0?'open':''}><summary>${label}</summary><div class="chip-group">
      <button class="chip ${state.f[key]===''?'on':''}" data-k="${key}" data-v="">全部</button>
      ${opts.map(([v,t])=>`<button class="chip ${state.f[key]===v?'on':''}" data-k="${key}" data-v="${v}">${t}</button>`).join('')}
    </div></details>`).join('');
  document.querySelectorAll('.chip[data-k]').forEach(b => b.onclick = () => {
    state.f[b.dataset.k] = b.dataset.v; renderFilters(); renderList();
  });
}

function renderList(){
  const rows = ITEMS.filter(matches);
  $('#hits').textContent = state.q ? `命中 ${rows.length}` : `${rows.length} 题`;
  $('#list').innerHTML = rows.map(it => `
    <div class="row ${state.cur && state.cur.item_id===it.item_id?'on':''}" data-id="${it.item_id}">
      <div class="row-meta"><span class="no">Q${it.source.question_no}</span>
        <span class="st">${it.source.exam} S${it.source.set}·${it.source.passage_id}</span>
        <span class="tag">${TYPES[it.tags.question_type]||it.tags.question_type}</span>
        <span class="tag">${'★'.repeat(it.tags.difficulty)}</span></div>
      <div class="row-text">${esc(it.stem)}</div>
    </div>`).join('') || `<div class="empty-state">没有匹配的题<br>换个词，或把筛选点回「全部」</div>`;
  document.querySelectorAll('#list .row').forEach(r => r.onclick = () => select(r.dataset.id));
}

function select(id){
  state.cur = ITEMS.find(i => i.item_id === id) || null;
  try{history.replaceState(null,'','?item='+id)}catch(e){}
  renderList(); renderDetail();
  const r = document.querySelector('.row.on'); if(r) r.scrollIntoView({block:'center'});
}

function renderDetail(){
  const it = state.cur;
  if(!it){ $('#content').innerHTML = `<div class="empty-state">左侧选一道题</div>`; return; }
  const pass = PASS[it.passage_key];
  const tabs = `<div class="tabs">
    <button class="tab ${state.view==='q'?'active':''}" data-v="q">题目卡</button>
    <button class="tab ${state.view==='a'?'active':''}" data-v="a">原文</button>
    <button class="tab ${state.view==='trap'?'active':''}" data-v="trap">陷阱档案</button></div>`;
  let body = '';
  if(state.view === 'q') body = qView(it);
  if(state.view === 'a') body = aView(it, pass);
  if(state.view === 'trap') body = trapView();
  $('#content').innerHTML = `<div class="wrap ${state.view==='trap'?'wide':''}">${tabs}${body}</div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.view = b.dataset.v; renderDetail(); });
  bindQ(it);
}

function qView(it){
  const opts = it.options.map(o => `<button class="opt" data-k="${o.key}">
    <span class="k">${o.key}</span><span class="text">${esc(o.text)}</span></button>`).join('');
  const tags = `<span class="tag">${TYPES[it.tags.question_type]}</span>` +
    it.tags.skills.map(s=>`<span class="tag">${s}</span>`).join('') +
    it.tags.distractor_types.map(d=>`<span class="tag">${TRAPS[d]||d}</span>`).join('') +
    `<span class="tag">${'★'.repeat(it.tags.difficulty)}</span>`;
  return `<div class="tag-group">${tags}</div>
    <div class="stem">${esc(it.stem)}</div>
    <div class="options">${opts}</div>
    <div id="res"></div>`;
}

function bindQ(it){ if(state.view === 'q') document.querySelectorAll('.opt').forEach(b => b.onclick = () => judge(it, b.dataset.k)); }

function judge(it, k){
  const ok = k === it.answer;
  document.querySelectorAll('.opt').forEach(b => {
    b.classList.remove('right','wrong');
    if(b.dataset.k === it.answer) b.classList.add('right');
    if(b.dataset.k === k && !ok) b.classList.add('wrong');
  });
  const ex = it.explain, para = ex.answer_evidence_para;
  const wrong = (ex.wrong_options||[]).find(w => w.key === k);
  const pv = (ex.paraphrase||[]).map(p => `<div class="ptab-row"><div class="ptab-col">${esc(p.from)}</div><div class="ptab-col">${esc(p.to)}</div></div>`).join('');
  const others = (ex.wrong_options||[]).map(w=>`<div class="ptab-row">
      <div class="ptab-col col-k"><span class="k">${w.key}</span></div>
      <div class="ptab-col col-type"><span class="ptag">${TRAPS[w.type]||w.type}</span></div>
      <div class="ptab-col col-reason">${esc(w.why)}</div>
      <div class="ptab-col col-src"><span class="src">${esc(w.source||'无')}</span></div></div>`).join('');
  $('#res').innerHTML = `<div class="explain">
    <div class="explain-block">
      <div class="explain-title green">✓ 正确${para?' · 第 '+para+' 段':''}</div>
      <div class="ev">${esc(ex.answer_evidence)}</div>
    </div>
    ${wrong ? `<div class="explain-block">
      <div class="explain-title red">✗ ${k} 错在哪</div>
      <div class="ev bad"><b>${TRAPS[wrong.type]||wrong.type}</b> · ${esc(wrong.why)}</div>
    </div>` : ''}
    ${pv ? `<div class="explain-block"><div class="explain-title">同义替换</div>
      <div class="ptab paraphrase"><div class="ptab-row header"><div class="ptab-col">原文</div><div class="ptab-col">题目/正确项</div></div>${pv}</div></div>` : ''}
    ${others ? `<div class="explain-block"><div class="explain-title">其余干扰项</div>
      <div class="ptab distractor"><div class="ptab-row header">
        <div class="ptab-col col-k">项</div><div class="ptab-col col-type">类型</div>
        <div class="ptab-col col-reason">为什么错</div><div class="ptab-col col-src">出处</div></div>${others}</div></div>` : ''}
  </div>`;
  $('#res').scrollIntoView({block:'nearest',behavior:'smooth'});
}

function aView(it, pass){
  const ev = norm(it.explain.answer_evidence);
  const paras = pass.paragraphs.map((p, i) => {
    const hit = norm(p).includes(ev);
    return `<div class="para ${hit?'hl':''}"><span class="pn">P${i+1}</span>${esc(p)}${hit?'<span class="ptag">答案句</span>':''}</div>`;
  }).join('');
  const badges = pass.questions.map(q => {
    const x = ITEMS.find(i => i.passage_key===pass.key && i.source.question_no===q);
    return `<button class="chip" data-id="${x.item_id}">Q${q} → ${x.answer}</button>`;
  }).join(' ');
  return `<div class="ptitle">${pass.exam} 第${pass.set}套 · ${pass.passage_id} · ${pass.word_count} 词</div>
    <div class="chip-group" style="margin-bottom:14px">${badges}</div>${paras}`;
}

function trapView(){
  const all = ITEMS.flatMap(i => (i.explain.wrong_options||[]).map(w => ({...w, item:i})));
  const groups = {};
  all.forEach(w => (groups[w.type] = groups[w.type]||[]).push(w));
  const order = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  return `<div class="ptitle">陷阱档案 · ${all.length} 个干扰项 / ${order.length} 类</div>
    <div class="archive-container">` + order.map(t => {
      const arr = groups[t];
      const idx = TRAP_ORDER.indexOf(t) + 1;
      return `<div class="trap-card" data-type="${idx}">
        <div class="trap-head">
          <div class="trap-title-row"><h3>${TRAPS[t]||t}</h3><span class="trap-count">${arr.length} 项</span></div>
          <p class="trap-def">${TRAP_DEF[t]||''}</p>
        </div>
        <div class="trap-list">${arr.map(w=>`
          <div class="trap-rec">
            <div class="trap-meta"><span class="no">${w.item.source.exam.slice(2)} Q${w.item.source.question_no}</span><span class="tag">${w.key}</span></div>
            <div class="trap-content"><div class="reason">${esc(w.why)}</div>
              <span class="src ${w.source?'':'empty'}">${esc(w.source||'无（原文无对应）')}</span></div>
          </div>`).join('')}</div>
      </div>`;
    }).join('') + `</div>`;
}

$('#q').oninput = e => { state.q = e.target.value.trim(); renderList(); };
$('#burger').onclick = () => document.body.classList.toggle('collapsed');
$('#theme').onclick = () => {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('cet-theme', h.dataset.theme);
};
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#q').focus(); }
  if(e.key === 'Escape' && document.activeElement === $('#q')){ $('#q').value=''; state.q=''; $('#q').blur(); renderList(); }
});
if(localStorage.getItem('cet-theme')) document.documentElement.dataset.theme = localStorage.getItem('cet-theme');

renderFilters(); renderList();
const P = new URLSearchParams(location.search);
if(P.get('q')){ state.q = P.get('q'); $('#q').value = state.q; renderList(); }
const deep = P.get('item');
if(P.get('collapsed')) document.body.classList.add('collapsed');
if(deep) select(deep); else { const first = ITEMS.filter(matches)[0]; if(first) select(first.item_id); }
if(P.get('view')){ state.view = P.get('view'); renderDetail(); }
if(P.get('judge') && state.cur) judge(state.cur, P.get('judge'));
</script>
